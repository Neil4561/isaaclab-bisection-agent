name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --editable ".[test]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Verify CLI installation
        run: isaaclab-bisect --help
      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify clean wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/isaaclab-bisection-agent
          /tmp/isaaclab-bisection-agent/bin/python -m pip install --no-deps dist/*.whl
          /tmp/isaaclab-bisection-agent/bin/isaaclab-bisect --help
          /tmp/isaaclab-bisection-agent/bin/isaaclab-bisect-skill --help

  container:
    name: Container build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Build reconstruction image
        run: docker build --file docker/Dockerfile --tag isaaclab-bisection-agent:test .
